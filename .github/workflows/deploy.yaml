# =============================================================================
# Deploy to k3s — Build, push, and deploy Amy Rose to your VPS k3s cluster
# =============================================================================
name: "Deploy to k3s"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/g2studio
  NAMESPACE: amyrose

jobs:
  # ─── Build & Push Frontend + Migrator ──────────────────────────────────────
  build-frontend:
    name: "Build & Push Frontend"
    runs-on: arc-runner-dind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build frontend image
        run: |
          docker build \
            --target runner \
            --cache-from ${{ env.IMAGE }}:amyrose-frontend-latest \
            -t ${{ env.IMAGE }}:amyrose-frontend-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-frontend-latest \
            -f frontend/Dockerfile \
            frontend/

      - name: Build migrator image
        run: |
          docker build \
            --target migrator \
            -t ${{ env.IMAGE }}:amyrose-migrator-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-migrator-latest \
            -f frontend/Dockerfile \
            frontend/

      - name: Push images
        run: |
          docker push ${{ env.IMAGE }}:amyrose-frontend-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-frontend-latest
          docker push ${{ env.IMAGE }}:amyrose-migrator-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-migrator-latest

  # ─── Build & Push Backend ───────────────────────────────────────────────────
  build-backend:
    name: "Build & Push Backend"
    runs-on: arc-runner-dind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --cache-from ${{ env.IMAGE }}:amyrose-backend-latest \
            -t ${{ env.IMAGE }}:amyrose-backend-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-backend-latest \
            -f backend/Dockerfile \
            backend/

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:amyrose-backend-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-backend-latest

  # ─── Run Prisma Migrations ─────────────────────────────────────────────────
  migrate:
    name: "Run DB Migrations"
    runs-on: arc-runner-org
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Ensure Docker Hub pull secret exists
        run: |
          kubectl -n ${{ env.NAMESPACE }} create secret docker-registry dockerhub-pull \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run migration job
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          export JOB_NAME="prisma-migrate-${SHORT_SHA}"
          sed -i "s|image: .*|image: ${{ env.IMAGE }}:amyrose-migrator-${{ github.sha }}|" k8s/migration-job.yaml
          sed -i "s|\${CI_COMMIT_SHORT_SHA}|${SHORT_SHA}|g" k8s/migration-job.yaml
          kubectl apply -f k8s/migration-job.yaml
          kubectl -n ${{ env.NAMESPACE }} wait --for=condition=complete --timeout=120s job/${JOB_NAME}

  # ─── Deploy to k3s ─────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to k3s"
    runs-on: arc-runner-org
    needs: [build-frontend, build-backend, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Set image in manifests
        run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE }}:amyrose-frontend-${{ github.sha }}|" k8s/frontend.yaml
          sed -i "s|image: .*|image: ${{ env.IMAGE }}:amyrose-backend-${{ github.sha }}|" k8s/backend.yaml

      - name: Inject secrets into k8s manifests
        run: |
          cp k8s/secrets.yaml k8s/secrets-rendered.yaml
          sed -i "s|\${DATABASE_URL}|${{ secrets.DATABASE_URL }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${DB_HOST}|${{ secrets.DB_HOST }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${DB_PORT}|${{ secrets.DB_PORT }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${DB_USERNAME}|${{ secrets.DB_USERNAME }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${DB_NAME}|${{ secrets.DB_NAME }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${AUTH_SECRET}|${{ secrets.AUTH_SECRET }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${AUTH_URL}|${{ secrets.AUTH_URL }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${JWT_SECRET}|${{ secrets.JWT_SECRET }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${JWT_REFRESH_SECRET}|${{ secrets.JWT_REFRESH_SECRET }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${MERCADOPAGO_ACCESS_TOKEN}|${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${MERCADOPAGO_WEBHOOK_SECRET}|${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}|g" k8s/secrets-rendered.yaml
          sed -i "s|\${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY}|${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY }}|g" k8s/secrets-rendered.yaml

      - name: Create Docker Hub pull secret
        run: |
          kubectl -n ${{ env.NAMESPACE }} create secret docker-registry dockerhub-pull \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets-rendered.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}
