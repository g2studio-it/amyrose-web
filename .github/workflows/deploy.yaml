# =============================================================================
# Deploy to k3s — Build images and open PR in GitOps repo (ArgoCD deploys)
# =============================================================================
name: "Build & Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/g2studio
  GITOPS_REPO: g2studio-it/k3s-g2studio-argocd
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Build & Push Frontend + Migrator ──────────────────────────────────────
  build-frontend:
    name: "Build & Push Frontend"
    runs-on: arc-runner-dind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build frontend image
        run: |
          docker build \
            --target runner \
            --cache-from ${{ env.IMAGE }}:amyrose-frontend-latest \
            -t ${{ env.IMAGE }}:amyrose-frontend-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-frontend-latest \
            -f frontend/Dockerfile \
            frontend/

      - name: Build migrator image
        run: |
          docker build \
            --target migrator \
            -t ${{ env.IMAGE }}:amyrose-migrator-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-migrator-latest \
            -f frontend/Dockerfile \
            frontend/

      - name: Push images
        run: |
          docker push ${{ env.IMAGE }}:amyrose-frontend-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-frontend-latest
          docker push ${{ env.IMAGE }}:amyrose-migrator-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-migrator-latest

  # ─── Build & Push Backend ───────────────────────────────────────────────────
  build-backend:
    name: "Build & Push Backend"
    runs-on: arc-runner-dind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --cache-from ${{ env.IMAGE }}:amyrose-backend-latest \
            -t ${{ env.IMAGE }}:amyrose-backend-${{ github.sha }} \
            -t ${{ env.IMAGE }}:amyrose-backend-latest \
            -f backend/Dockerfile \
            backend/

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:amyrose-backend-${{ github.sha }}
          docker push ${{ env.IMAGE }}:amyrose-backend-latest

  # ─── Open PR en GitOps repo — ArgoCD se encarga del deploy ────────────────
  update-gitops:
    name: "Update GitOps repo"
    runs-on: arc-runner-org
    needs: [build-frontend, build-backend]
    env:
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Open PR in k3s-g2studio-argocd
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="deploy/amyrose-${SHORT_SHA}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${GITOPS_REPO}.git gitops
          cd gitops

          git config user.email "ci@g2studio.it.com"
          git config user.name "G2Studio CI"
          git checkout -b "$BRANCH"

          sed -i "s|newTag: amyrose-frontend-.*|newTag: amyrose-frontend-${{ github.sha }}|" \
            projects/amyrose-web/frontend/kustomization.yaml

          sed -i "s|newTag: amyrose-backend-.*|newTag: amyrose-backend-${{ github.sha }}|" \
            projects/amyrose-web/backend/kustomization.yaml

          git add projects/amyrose-web/
          git commit -m "deploy: amyrose → ${SHORT_SHA}"
          git push origin "$BRANCH"

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITOPS_REPO}/pulls \
            -d "{
              \"title\": \"deploy: amyrose → ${SHORT_SHA}\",
              \"body\": \"Triggered by [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }"
