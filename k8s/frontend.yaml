apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: amyrose
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${CI_REGISTRY_IMAGE}/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: AUTH_URL
            - name: BACKEND_API_URL
              value: "http://backend:3001/api/v1"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://amyrose.example.com"
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
            - name: MERCADOPAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: MERCADOPAGO_WEBHOOK_SECRET
            - name: NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: amyrose
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
