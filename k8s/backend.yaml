apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: amyrose
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ${DOCKERHUB_USERNAME}/amyrose-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: API_PREFIX
              value: api/v1
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "15m"
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_REFRESH_EXPIRATION
              value: "7d"
            - name: ALLOWED_ORIGINS
              value: "https://amyrose.example.com"
            - name: THROTTLE_TTL
              value: "60"
            - name: THROTTLE_LIMIT
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: amyrose
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
