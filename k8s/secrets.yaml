apiVersion: v1
kind: Secret
metadata:
  name: amyrose-secrets
  namespace: amyrose
type: Opaque
stringData:
  # ─── Database ────────────────────────────────────────────────────────────────
  DATABASE_URL: "postgresql://postgres:changeme@postgres:5432/amyrose_db?schema=public"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "changeme"
  DB_NAME: "amyrose_db"
  POSTGRES_PASSWORD: "changeme"

  # ─── NextAuth ────────────────────────────────────────────────────────────────
  AUTH_SECRET: "CHANGE_ME_generate_with_openssl_rand_base64_32"
  AUTH_URL: "https://amyrose.example.com"

  # ─── JWT ─────────────────────────────────────────────────────────────────────
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  JWT_REFRESH_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_32"

  # ─── MercadoPago ─────────────────────────────────────────────────────────────
  MERCADOPAGO_ACCESS_TOKEN: ""
  MERCADOPAGO_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ""
