apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amyrose-ingress
  namespace: amyrose
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - amyrose.g2studio.it.com
      secretName: amyrose-tls
  rules:
    - host: amyrose.g2studio.it.com
      http:
        paths:
          # ✅ Más específico primero: NextAuth va al frontend
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # ✅ Backend NestJS solo recibe /api/v1/*
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001

          # ✅ Todo lo demás va al frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000