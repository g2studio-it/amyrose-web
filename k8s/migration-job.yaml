apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-${CI_COMMIT_SHORT_SHA}
  namespace: amyrose
  labels:
    app: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: migrate
          image: coddyshelby/g2studio:amyrose-migrator-latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amyrose-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
